spring:
  application:
    name: roster-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roster}
    username: ${DB_USER:roster}
    password: ${DB_PASSWORD:roster}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    admin:
      auto-create: false
      fail-fast: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: roster-sync

roster:
  buckets: 256
  reconciliation:
    brake-missing-ratio: ${ROSTER_BRAKE_MISSING_RATIO:0.30}
    brake-rejected-ratio: ${ROSTER_BRAKE_REJECTED_RATIO:0.05}
    data-dir: ${ROSTER_DATA_DIR:/tmp/roster-data}
    async: true
  outbox:
    publisher: ${ROSTER_OUTBOX_PUBLISHER:log}
    topic: roster.employee.changed
    batch-size: 500
    poll-interval-ms: 200
    max-backoff: 30s
    publish-timeout: 5s
    relay-enabled: true
  cache:
    office-ttl: 5m
    office-max-tenants: 10000
  security:
    jwt-secret: ${ROSTER_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    dev-tokens-enabled: ${ROSTER_DEV_TOKENS:false}
